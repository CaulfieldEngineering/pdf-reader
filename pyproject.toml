[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-reader"
version = "0.1.0"
description = "Local, offline voice PDF reader with neural TTS, sentence highlighting and smart skipping"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "kokoro-onnx>=0.6.1",
    "onnxruntime>=1.18",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "reportlab>=4", "httpx>=0.27"]

[project.scripts]
pdf-reader = "pdf_reader.__main__:main"

[tool.setuptools.packages.find]
include = ["pdf_reader*"]

[tool.setuptools.package-data]
pdf_reader = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
